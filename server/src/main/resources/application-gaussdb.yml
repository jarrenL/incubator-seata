# Activated by: --spring.profiles.active=gaussdb  or  SPRING_PROFILES_ACTIVE=gaussdb
# Target DB: GaussDB centralized edition at 1.92.120.69:8000 (PostgreSQL-compatible)
seata:
  config:
    type: file
  registry:
    type: file
  store:
    # Use DB store backed by GaussDB
    mode: db
    session:
      mode: db
    lock:
      mode: db
    db:
      datasource: druid
      # Seata internally treats 'gaussdb' as a PostgreSQL-compatible branch
      # (see LogStoreDataBaseDAO, JdbcUtils, XAUtils).
      db-type: gaussdb
      driver-class-name: com.huawei.gaussdb.jdbc.Driver
      url: jdbc:gaussdb://1.92.120.69:8000/postgres?currentSchema=public
      user: root
      password: GaussDB123
      min-conn: 5
      max-conn: 30
      global-table: global_table
      branch-table: branch_table
      lock-table: lock_table
      distributed-lock-table: distributed_lock
      vgroup-table: vgroup_table
      query-limit: 1000
      max-wait: 5000
      druid:
        time-between-eviction-runs-millis: 120000
        min-evictable-idle-time-millis: 300000
        test-while-idle: true
        test-on-borrow: false
        validation-query: SELECT 1
        keep-alive: false
